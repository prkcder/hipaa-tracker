services:
  - type: web
    name: hipaa-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hipaa-db
          property: connectionString

  - type: web
    name: hipaa-frontend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://hipaa-backend.onrender.com

  - type: web
    name: hipaa-crawler
    env: docker
    dockerfilePath: ./crawler/Dockerfile
    dockerContext: ./crawler
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium-browser
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"

databases:
  - name: hipaa-db
    plan: free
